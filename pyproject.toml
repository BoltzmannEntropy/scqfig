[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scqfig"
version = "0.1.0"
description = "Publication figures for superconducting-qubit and chip papers, in two matched styles, with a companion LaTeX package"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.6"]
keywords = ["superconducting qubits", "transmon", "matplotlib", "publication figures", "LaTeX", "circuit QED"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E731", "E741"]     # short lambdas and physics names (I, Q, E) read better in plotting code

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["E402"]
"examples/build_gallery.py" = ["E402"]
